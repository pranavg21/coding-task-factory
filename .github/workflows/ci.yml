name: Factory CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & dev deps
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run factory unit & guard tests
        run: pytest -q
      - name: Smoke-test CLI help & schema validation
        run: |
          factory --help
          factory prove --help
          factory generate --help
          python -c "from factory.schemas import ProofMatrix; print('Schemas OK')"
