[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-task-factory"
version = "0.1.0"
description = "Innodata AI Hackathon Track 1: Reusable, test-gated SWE Coding Task Factory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "google-genai>=3.6.1",
    "anthropic>=2.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
factory = "factory.cli:app"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
